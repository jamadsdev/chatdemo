<!-- 1. Site settings -->
<script>
  window.CHAT_CONFIG = {
    // true: load chat only after your cookie banner calls webexChat.grantConsent().
    // Keep false if you use the widget's built-in "Take consent from the customer" setting instead.
    requireConsent: false,

    // true: load chat once the page is idle (faster page loads; chat appears 1-2 s later).
    loadWhenIdle: false,

    // true: your site changes pages without full reloads (React, Vue, Angular routers).
    singlePageApp: false,

    // Pages where chat is hidden, unless the visitor already started a chat this session.
    noChatPaths: [/^\/checkout\/payment/, /^\/account\/login/, /^\/account\/reset-password/],

    // Shown only if the chat script can't load (ad blocker, proxy, network problem).
    fallbackPhoneDisplay: "1-800-555-0100",
    fallbackPhoneDial: "+18005550100",
    fallbackContactUrl: "https://www.example.com/contact",

    // Context shown to agents. Names must match custom chat fields in the admin console.
    // Empty values are skipped. Never send card numbers, passwords, government IDs or health details.
    getCustomFields: function () {
      var user = window.siteUser || {}; // replace with however your site exposes the signed-in user
      return {
        "Customer ID": user.id,
        "Account Tier": user.tier,
        "Page Type": document.body.getAttribute("data-page-type") || "General"
      };
    }
  };
</script>

<!-- 3. Client-level customizations -->
<script>
  (function () {
    var config = window.CHAT_CONFIG || {};
    var CONSENT_KEY = "webexChatConsent";
    var readyCallbacks = [];
    var widget = null; // set when Cisco's widget reports ready
    var loadRequested = false;
    var hiddenByUs = false;
    var openWhenReady = false;
    var lastFieldsJson = "";

    // ----- Run code once the widget is ready -----
    function runSafely(fn) {
      try {
        fn(widget);
      } catch (err) {
        console.error("Chat customization failed:", err);
      }
    }

    function onChatReady(fn) {
      if (widget) runSafely(fn);
      else readyCallbacks.push(fn);
    }

    // Cisco's script creates window.imichatwidget; check every 50 ms for up to 30 s.
    function watchForWidget() {
      var tries = 0;
      (function check() {
        var w = window.imichatwidget;
        if (w && typeof w.on === "function") {
          w.on("imichat-widget:ready", function () {
            if (widget) return;
            widget = w;
            readyCallbacks.splice(0).forEach(runSafely);
          });
        } else if (tries++ < 600) {
          setTimeout(check, 50);
        }
      })();
    }

    // ----- Loading: consent and idle timing -----
    function loadChat() {
      if (loadRequested) return;
      loadRequested = true;
      var start = function () {
        i.t();
        watchForWidget();
      };
      if (!config.loadWhenIdle) return start();
      var startWhenIdle = function () {
        if (window.requestIdleCallback) requestIdleCallback(start, { timeout: 3000 });
        else setTimeout(start, 1500);
      };
      if (document.readyState === "complete") startWhenIdle();
      else window.addEventListener("load", startWhenIdle);
    }

    function hasStoredConsent() {
      try {
        return localStorage.getItem(CONSENT_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function grantConsent() {
      try {
        localStorage.setItem(CONSENT_KEY, "1");
      } catch (e) {}
      loadChat();
    }

    // ----- Context for agents (custom chat fields) -----
    function sendCustomFields(w) {
      if (typeof config.getCustomFields !== "function") return;
      var raw = config.getCustomFields() || {};
      var fields = {};
      var count = 0;
      Object.keys(raw).forEach(function (name) {
        var value = raw[name];
        if (value !== undefined && value !== null && value !== "") {
          fields[name] = String(value);
          count++;
        }
      });
      if (!count) return;
      var json = JSON.stringify({ custom_chat_fields: fields });
      if (json === lastFieldsJson) return;
      // First send uses init; later changes use update. Both apply to chats started afterwards.
      var send = lastFieldsJson && typeof w.update === "function" ? w.update : w.init;
      lastFieldsJson = json;
      send.call(w, json, function () {});
    }

    // ----- Hide chat on sensitive pages -----
    function isNoChatPage() {
      return (config.noChatPaths || []).some(function (pattern) {
        return pattern.test(location.pathname);
      });
    }

    function applyVisibility(w) {
      if (isNoChatPage() && !w.hasInitiatedChat()) {
        w.hide();
        hiddenByUs = true;
      } else if (hiddenByUs) {
        // Only re-show what this code hid, so off-hours settings stay in control.
        w.show();
        hiddenByUs = false;
      }
    }

    // ----- Launchers and ?chat=open links -----
    function openChat() {
      if (!widget) {
        openWhenReady = true;
        return;
      }
      widget.show();
      hiddenByUs = false;
      widget.maximizeWindow();
    }

    document.addEventListener("click", function (event) {
      var target = event.target;
      var launcher = target && target.closest ? target.closest("[data-open-chat]") : null;
      if (!launcher) return;
      event.preventDefault();
      openChat();
    });

    function isDeepLinkOpen() {
      try {
        return new URLSearchParams(location.search).get("chat") === "open";
      } catch (e) {
        return false;
      }
    }

    // ----- Single-page apps: re-check after client-side navigation -----
    function refresh() {
      onChatReady(function (w) {
        applyVisibility(w);
        sendCustomFields(w);
      });
    }

    function watchRouteChanges() {
      ["pushState", "replaceState"].forEach(function (method) {
        var original = history[method];
        history[method] = function () {
          var result = original.apply(this, arguments);
          setTimeout(refresh, 0);
          return result;
        };
      });
      window.addEventListener("popstate", function () {
        setTimeout(refresh, 0);
      });
    }

    // ----- Start -----
    window.webexChat = {
      grantConsent: grantConsent, // call from your cookie banner when requireConsent is true
      open: openChat, // open chat from your own code
      refresh: refresh // call from your router if page data updates after navigation
    };

    onChatReady(function (w) {
      document.documentElement.classList.add("webex-chat-ready");
      sendCustomFields(w);
      applyVisibility(w);
      if (openWhenReady || isDeepLinkOpen()) {
        openWhenReady = false;
        openChat();
      }
    });

    if (config.singlePageApp) watchRouteChanges();
    if (!config.requireConsent || hasStoredConsent()) loadChat();
  })();
</script>
